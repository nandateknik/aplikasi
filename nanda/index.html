<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Nanda Teknik</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex h-screen overflow-hidden">

    <!-- Kontainer Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Area Konten Utama -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <!-- Overlay Gelap saat menu HP terbuka -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden"></div>
        
        <!-- Kontainer Navbar -->
        <div id="navbar-container"></div>

        <!-- Halaman Dashboard -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-slate-800">Dashboard Utama</h1>
                <p class="text-slate-500 text-sm mt-1">Ringkasan aktivitas bisnis Nanda Teknik Banyuwangi.</p>
            </div>

            <!-- Kartu Statistik -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <!-- Kartu 1 -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="bg-blue-100 text-blue-600 p-3 rounded-lg"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg></div>
                    <div><p class="text-xs text-slate-500 font-semibold uppercase">Total Pelanggan</p><h3 class="text-2xl font-bold text-slate-800" id="statPelanggan">...</h3></div>
                </div>
                <!-- Kartu 2 -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="bg-amber-100 text-amber-600 p-3 rounded-lg"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg></div>
                    <div><p class="text-xs text-slate-500 font-semibold uppercase">Penawaran Aktif</p><h3 class="text-2xl font-bold text-slate-800">12</h3></div>
                </div>
                <!-- Kartu 3 -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="bg-green-100 text-green-600 p-3 rounded-lg"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                    <div><p class="text-xs text-slate-500 font-semibold uppercase">Proyek Selesai</p><h3 class="text-2xl font-bold text-slate-800">45</h3></div>
                </div>
                <!-- Kartu 4 -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="bg-purple-100 text-purple-600 p-3 rounded-lg"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg></div>
                    <div><p class="text-xs text-slate-500 font-semibold uppercase">Invoice Belum Dibayar</p><h3 class="text-2xl font-bold text-slate-800">3</h3></div>
                </div>
            </div>

            <!-- Area Quick Action -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                <h3 class="font-bold text-lg mb-4 text-slate-800">Aksi Cepat</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <a href="pelanggan.html" class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-lg border border-slate-100 hover:bg-blue-50 hover:border-blue-200 transition group">
                        <div class="bg-white p-2 rounded-full shadow-sm mb-2 group-hover:text-blue-600">➕</div>
                        <span class="text-sm font-medium">Pelanggan Baru</span>
                    </a>
                    <a href="penawaran.html" class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-lg border border-slate-100 hover:bg-blue-50 hover:border-blue-200 transition group">
                        <div class="bg-white p-2 rounded-full shadow-sm mb-2 group-hover:text-blue-600">📄</div>
                        <span class="text-sm font-medium">Buat Penawaran</span>
                    </a>
                    <a href="spk.html" class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-lg border border-slate-100 hover:bg-blue-50 hover:border-blue-200 transition group">
                        <div class="bg-white p-2 rounded-full shadow-sm mb-2 group-hover:text-blue-600">🛠️</div>
                        <span class="text-sm font-medium">Buat SPK</span>
                    </a>
                    <a href="invoice.html" class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-lg border border-slate-100 hover:bg-blue-50 hover:border-blue-200 transition group">
                        <div class="bg-white p-2 rounded-full shadow-sm mb-2 group-hover:text-blue-600">💰</div>
                        <span class="text-sm font-medium">Terbitkan Invoice</span>
                    </a>
                </div>
            </div>
            
        </main>
    </div>

    <!-- Script Utama Penggerak Template -->
    <script src="js/app.js"></script>

    <!-- Mengambil data total pelanggan (Opsional) -->
    <script>
        window.addEventListener('load', async () => {
            if(localStorage.getItem('userData')) {
                const API = 'https://script.google.com/macros/s/AKfycbwhdLK5XeJgQwlfElG-1t7hPyrADkJsM90zAdNUUW5ucTF2AaHTPBEYzWnuTHoKcY-D/exec';
                try {
                    const res = await fetch(API + '?action=getPelanggan');
                    const json = await res.json();
                    if(json.status === 'success') {
                        document.getElementById('statPelanggan').innerText = json.data.length;
                    }
                } catch(e) { console.log(e); }
            }
        });
    </script>
</body>
</html>
