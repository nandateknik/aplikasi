<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Work Order — WorkFlow Pro</title><link rel="stylesheet" href="styles.css"><style>
.portal{max-width:980px;margin:auto;padding:28px 18px}.portal-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.portal h1{font:800 27px Manrope;margin:4px 0}.portal-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.cal{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.cal-head button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow,.day{text-align:center;padding:10px 2px;font-size:11px}.dow{color:#8b96a8;font-weight:700}.day{border:1px solid #e9edf3;background:#fff;border-radius:8px;cursor:pointer;min-height:42px}.day:disabled{cursor:not-allowed;opacity:.38}.day.available{background:#eaf8f0;border-color:#c9edda;color:#147a50}.day.limited{background:#fff5e5;border-color:#f6dfb5;color:#a36b12}.day.full{background:#fff0ef;border-color:#f4d0cd;color:#ba4943}.day.selected{outline:2px solid #3568e8;outline-offset:1px}.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:15px;font-size:10px;color:#687589}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.portal-form{background:white;border:1px solid var(--line);border-radius:13px;padding:20px}.portal-form h2{font:700 15px Manrope;margin:0 0 10px}.portal-form .btn{margin-top:10px}.result{padding:12px;border-radius:8px;background:#eff7ff;color:#2454a6;font-size:11px;line-height:1.6;margin-top:12px;overflow-wrap:anywhere}.track{margin-top:18px}.track input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.track-result{margin-top:10px;font-size:11px}.bar{height:8px;background:#e9edf3;border-radius:20px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:#2ca875}.smallmuted{font-size:10px;color:#8994a5}@media(max-width:760px){.portal-grid{grid-template-columns:1fr}.portal-head{align-items:flex-start;flex-direction:column}.day{min-height:37px;padding:8px 0}}
</style></head><body><main class="portal"><header class="portal-head"><div><p class="eyebrow">CUSTOMER SELF-SERVICE</p><h1>Booking Work Order</h1><p class="muted">Pilih tanggal yang tersedia dan ajukan kebutuhan teknisi tanpa membuat akun.</p></div><a href="index.html" class="btn ghost">Admin login</a></header><div class="portal-grid"><section class="cal"><div class="cal-head"><button id="prev">‹</button><b id="monthLabel">—</b><button id="next">›</button></div><div class="days" id="calendar"></div><div class="legend"><span><i style="background:#35a875"></i>Tersedia</span><span><i style="background:#e4a53a"></i>Hampir penuh</span><span><i style="background:#d45b54"></i>Penuh</span></div><p class="smallmuted" id="capacityNote"></p></section><section class="portal-form"><h2>Ajukan jadwal pekerjaan</h2><p class="muted">Tanggal pilihan: <b id="selectedDate">Belum dipilih</b></p><form id="booking"><label class="field">Nama lengkap / perusahaan<input name="customerName" required></label><label class="field">Nomor WhatsApp<input name="phone" required placeholder="08xxxxxxxxxx"></label><label class="field">Email (opsional)<input name="email" type="email"></label><label class="field">Alamat pekerjaan<input name="location" required></label><label class="field">Jenis pekerjaan<input name="title" required placeholder="Contoh: Instalasi CCTV"></label><label class="field">Detail kebutuhan<textarea name="description" rows="3"></textarea></label><button class="btn primary full">Kirim permintaan work order</button></form><div id="bookingResult"></div><div class="track"><h2>Lacak work order</h2><input id="tracking" placeholder="Masukkan kode tracking"><button class="btn secondary" id="trackBtn">Cek progress</button><div id="trackResult" class="track-result"></div></div></section></div></main><script src="config.js"></script><script src="booking.js"></script></body></html>
